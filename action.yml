name: "PR Review Bot"
description: "Automatically review PRs using Google Gemini AI"
author: "varunn15"

inputs:
  GITHUB_TOKEN:
    description: "GitHub token with repo access"
    required: true
  GEMINI_API_KEY:
    description: "Google Gemini API key"
    required: true

runs:
  using: "node20"
  main: "dist/index.js"  # ✅ Points to bundled file

branding:
  icon: "message-square"
  color: "blue"